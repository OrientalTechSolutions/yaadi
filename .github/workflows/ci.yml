name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the web demo be rebuilt and published again by hand.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its older run. Runs on main are
# never cancelled, so a Pages deploy is never cut off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: Flutter app
    # Pinned while ubuntu-latest moves to 26.04 (actions/runner-images#14748);
    # lcov, glibc and tzdata are verified on this image.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Lets gh attestation verify read the sqlite3 release's attestations.
      attestations: read
    steps:
      - uses: actions/checkout@v7
        with:
          # No later step pushes or fetches; gh uses GH_TOKEN.
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      # Tests load the SQLCipher library that the sqlite3 build hook downloads
      # on first use and checks against the sha256 hashes in the pub.dev
      # package (ARCHITECTURE.md section 5.1). The hook checks a restored file
      # against the same hash before using it.
      - name: Cache the SQLCipher library
        id: sqlcipher-cache
        uses: actions/cache@v6
        with:
          path: .dart_tool/hooks_runner/shared/sqlite3/build
          key: sqlcipher-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - run: sudo apt-get update && sudo apt-get install -y lcov
      - run: flutter pub get

      - name: Generated code is up to date
        run: |
          flutter gen-l10n
          dart run build_runner build
          dart run drift_dev make-migrations
          dart run drift_dev schema generate --data-classes --companions drift_schemas/vault/ test/drift/vault/generated/
          git status --porcelain
          test -z "$(git status --porcelain)"
          if [ -s build/l10n_untranslated.json ] && [ "$(tr -d ' \n{}' < build/l10n_untranslated.json)" != "" ]; then
            cat build/l10n_untranslated.json
            exit 1
          fi

      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze

      - name: Tests
        run: |
          flutter test --coverage
          {
            echo '### Coverage'
            echo '```'
            lcov --summary coverage/lcov.info 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The encryption tests never skip. Run on their own with --run-skipped,
      # they fail the job if SQLCipher is not loaded, if a skip creeps in (the
      # test runs anyway) or if no test carries the tag any more (exit 79).
      - name: Encryption tests on SQLCipher
        run: flutter test --tags sqlcipher --run-skipped

      # After a fresh download, also check that the library was built by the
      # sqlite3 package's release workflow (SLSA provenance).
      - name: Provenance of the SQLCipher library
        if: steps.sqlcipher-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          libraries=(.dart_tool/hooks_runner/shared/sqlite3/build/download-*/libsqlcipher.so)
          if [ ${#libraries[@]} -eq 0 ]; then
            echo "The sqlite3 hook downloaded no SQLCipher library"
            exit 1
          fi
          for library in "${libraries[@]}"; do
            sha256sum "$library"
            gh attestation verify --repo simolus3/sqlite3.dart "$library"
          done

      # Dart on Windows ignores TZ, so real time zones are only tested here.
      # Santiago moves its clocks at midnight, so local midnight can be missing.
      - name: Date tests in other time zones
        run: |
          for zone in Europe/London America/New_York Asia/Karachi America/Santiago; do
            TZ=$zone flutter test test/core/time test/features/today/domain/roll_forward_test.dart
          done

      - run: flutter build web --release --no-web-resources-cdn --base-href /yaadi/
      # Only main is published, so pull requests build the demo without
      # uploading it.
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: build/web

  # Publishes the web demo from main. Needs Pages enabled with GitHub Actions
  # as its source in the repository settings.
  deploy:
    name: Web demo
    needs: app
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One deploy at a time, and a running one is never cancelled.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
