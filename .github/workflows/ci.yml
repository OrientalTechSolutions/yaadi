name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Flutter app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      # M1 tests run on the system SQLite (pubspec.yaml hooks), so the sqlite3
      # build hook downloads nothing for them.
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev lcov
      - run: flutter pub get

      - name: Generated code is up to date
        run: |
          flutter gen-l10n
          dart run build_runner build
          dart run drift_dev make-migrations
          dart run drift_dev schema generate --data-classes --companions drift_schemas/vault/ test/drift/vault/generated/
          git status --porcelain
          test -z "$(git status --porcelain)"
          if [ -s build/l10n_untranslated.json ] && [ "$(tr -d ' \n{}' < build/l10n_untranslated.json)" != "" ]; then
            cat build/l10n_untranslated.json
            exit 1
          fi

      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze

      - name: Tests
        run: |
          flutter test --coverage
          {
            echo '### Coverage'
            echo '```'
            lcov --summary coverage/lcov.info 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Dart on Windows ignores TZ, so real time zones are only tested here.
      # Santiago moves its clocks at midnight, so local midnight can be missing.
      - name: Date tests in other time zones
        run: |
          for zone in Europe/London America/New_York Asia/Karachi America/Santiago; do
            TZ=$zone flutter test test/core/time test/features/today/domain/roll_forward_test.dart
          done

      - run: flutter build web --release --no-web-resources-cdn --base-href /yaadi/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  # Publishes the web demo from main. Needs Pages enabled with GitHub Actions
  # as its source in the repository settings.
  deploy:
    name: Web demo
    needs: app
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
